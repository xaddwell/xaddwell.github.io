<button id="theme-toggle" aria-label="Toggle dark mode"><i class="fas fa-moon"></i></button>
<script>
(function () {
  var root = document.documentElement;
  var btn = document.getElementById('theme-toggle');
  function render() {
    if (root.classList.contains('theme-dark')) {
      btn.innerHTML = '<i class="fas fa-sun"></i>';
    } else {
      btn.innerHTML = '<i class="fas fa-moon"></i>';
    }
  }
  btn.addEventListener('click', function () {
    root.classList.toggle('theme-dark');
    try {
      localStorage.setItem('theme', root.classList.contains('theme-dark') ? 'dark' : 'light');
    } catch (e) {}
    render();
  });
  render();
})();
</script>

<script>
(function () {
  var nav = document.querySelector('.sidebar-nav--mobile');
  if (!nav) return;

  var toggle = nav.querySelector('.sidebar-nav__toggle');
  var closeBtn = nav.querySelector('.section-drawer__close');
  var backdrop = document.querySelector('.section-drawer__backdrop');

  function setOpen(open) {
    nav.classList.toggle('is-open', open);
    document.body.classList.toggle('nav-open', open);
    if (toggle) toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  if (toggle) {
    toggle.addEventListener('click', function () {
      setOpen(!nav.classList.contains('is-open'));
    });
  }

  if (closeBtn) {
    closeBtn.addEventListener('click', function () { setOpen(false); });
  }

  if (backdrop) {
    backdrop.addEventListener('click', function () { setOpen(false); });
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') setOpen(false);
  });

  Array.prototype.forEach.call(nav.querySelectorAll('.sidebar-nav__link'), function (link) {
    link.addEventListener('click', function () { setOpen(false); });
  });
})();
</script>
