{% if include.modifier == "sidebar-nav--mobile" %}
<nav class="sidebar-nav sidebar-nav--mobile" aria-label="Section navigation">
  <button class="sidebar-nav__toggle" type="button" aria-expanded="false">
    <i class="fas fa-bars" aria-hidden="true"></i>
    <span>Sections</span>
  </button>
  <div class="section-drawer" role="dialog" aria-modal="true" aria-label="Section navigation">
    <div class="section-drawer__head">
      <span class="section-drawer__title">Sections</span>
      <button class="section-drawer__close" type="button" aria-label="Close menu"><i class="fas fa-times" aria-hidden="true"></i></button>
    </div>
    {% include section-nav-list.html %}
  </div>
</nav>
<div class="section-drawer__backdrop" aria-hidden="true"></div>
{% else %}
{% if site.data.navigation.main %}
<nav class="sidebar-nav sidebar-nav--card" aria-label="Section navigation">
  {% include section-nav-list.html %}
</nav>
{% endif %}
{% endif %}
